name: Validate Site

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test site navigation
        run: npm test

      - name: Build public site
        run: npm run build

      - name: Test Tree and Worker
        run: npm --prefix tools/tree test
